<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 1010" role="img" aria-label="RTRP M1 baseline architecture: GitHub Actions builds and deploys a single Trade API container to ECS Fargate behind an Application Load Balancer, with HTTPS via ACM and Route 53, container images in ECR, and Terraform state in S3 with DynamoDB locking.">
  <title>RTRP — M1 Baseline Architecture</title>
  <style>
    .bgCanvas { fill: #ffffff; }
    .cloudBox { fill: #fbfbfd; stroke: #94a3b8; }
    .regionBox { fill: #f6f7fb; stroke: #94a3b8; }
    .vpcBox { fill: #eef1fa; stroke: #6366f1; }
    .azBox { fill: none; stroke: #94a3b8; }
    .publicLane { fill: #eafaf0; stroke: #34a853; }
    .privateLane { fill: #f1eefc; stroke: #7c3aed; }
    .svcBox { fill: #ffffff; stroke: #334155; }
    .infraBox { fill: #ffffff; stroke: #334155; }
    .pill { fill: #fef2f2; stroke: #dc2626; }
    .pillText { fill: #991b1b; }
    .textPrimary { fill: #0f172a; }
    .textSecondary { fill: #475569; }
    .titleText { fill: #0f172a; }
    .laneLabel { fill: #334155; }
    .edgeLive { stroke: #2563eb; }
    .edgeDeploy { stroke: #ea580c; }
    .edgeText { fill: #1e293b; }
    @media (prefers-color-scheme: dark) {
      .bgCanvas { fill: #0d1117; }
      .cloudBox { fill: #11151c; stroke: #64748b; }
      .regionBox { fill: #151a22; stroke: #64748b; }
      .vpcBox { fill: #171a2b; stroke: #818cf8; }
      .azBox { stroke: #64748b; }
      .publicLane { fill: #0f2418; stroke: #4ade80; }
      .privateLane { fill: #211a35; stroke: #a78bfa; }
      .svcBox { fill: #1c2128; stroke: #cbd5e1; }
      .infraBox { fill: #1c2128; stroke: #cbd5e1; }
      .pill { fill: #3f1414; stroke: #f87171; }
      .pillText { fill: #fca5a5; }
      .textPrimary { fill: #e6edf3; }
      .textSecondary { fill: #9aa7b5; }
      .titleText { fill: #e6edf3; }
      .laneLabel { fill: #cbd5e1; }
      .edgeLive { stroke: #60a5fa; }
      .edgeDeploy { stroke: #fb923c; }
      .edgeText { fill: #cbd5e1; }
    }
    text { font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
    .h1 { font-size: 19px; font-weight: 700; }
    .h2 { font-size: 12px; font-weight: 700; }
    .lbl { font-size: 11.5px; font-weight: 600; }
    .sub { font-size: 10px; }
    .tiny { font-size: 9px; }
    .edgeLbl { font-size: 9.5px; }
  </style>

  <defs>
    <marker id="arrLiveM1" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto" markerUnits="userSpaceOnUse">
      <polygon points="0,0 7,3 0,6" class="edgeLive" fill="context-stroke"/>
    </marker>
    <marker id="arrDeployM1" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto" markerUnits="userSpaceOnUse">
      <polygon points="0,0 7,3 0,6" class="edgeDeploy" fill="context-stroke"/>
    </marker>
  </defs>

  <rect class="bgCanvas" x="0" y="0" width="1400" height="1010"/>

  <text x="40" y="32" class="h1 titleText">RTRP — M1 Baseline Architecture</text>

  <g class="edgeLbl">
    <line x1="1180" y1="16" x2="1220" y2="16" class="edgeLive" stroke-width="2.5" marker-end="url(#arrLiveM1)"/>
    <text x="1228" y="19" class="textSecondary">live request path</text>
    <line x1="1180" y1="34" x2="1220" y2="34" class="edgeDeploy" stroke-width="2.5" stroke-dasharray="5,3" marker-end="url(#arrDeployM1)"/>
    <text x="1228" y="37" class="textSecondary">deploy-time path</text>
  </g>

  <!-- ===================== TOP ZONE: CI/CD ===================== -->
  <rect x="40" y="66" width="175" height="70" rx="8" class="infraBox"/>
  <text x="127" y="92" text-anchor="middle" class="lbl textPrimary">GitHub Actions</text>
  <text x="127" y="108" text-anchor="middle" class="sub textSecondary">git push → main</text>
  <text x="127" y="122" text-anchor="middle" class="tiny textSecondary">AssumeRoleWithWebIdentity (OIDC)</text>

  <rect x="245" y="56" width="190" height="50" rx="7" class="infraBox"/>
  <text x="340" y="76" text-anchor="middle" class="lbl textPrimary">App Pipeline</text>
  <text x="340" y="91" text-anchor="middle" class="sub textSecondary">build → push ECR → deploy</text>

  <rect x="245" y="116" width="190" height="50" rx="7" class="infraBox"/>
  <text x="340" y="136" text-anchor="middle" class="lbl textPrimary">Infra Pipeline</text>
  <text x="340" y="151" text-anchor="middle" class="sub textSecondary">plan → approval → apply</text>

  <rect x="465" y="56" width="155" height="50" rx="7" class="infraBox"/>
  <text x="542" y="76" text-anchor="middle" class="lbl textPrimary">Health-check gate</text>
  <text x="542" y="91" text-anchor="middle" class="sub textSecondary">curl /health == 200</text>

  <rect x="465" y="116" width="155" height="50" rx="7" class="infraBox"/>
  <text x="542" y="136" text-anchor="middle" class="lbl textPrimary">Manual approval</text>
  <text x="542" y="151" text-anchor="middle" class="sub textSecondary">env: production-infra</text>

  <rect x="650" y="56" width="165" height="110" rx="8" class="infraBox"/>
  <text x="732" y="78" text-anchor="middle" class="lbl textPrimary">ECR</text>
  <text x="732" y="96" text-anchor="middle" class="sub textSecondary">rtrp-trade-api</text>
  <text x="732" y="112" text-anchor="middle" class="tiny textSecondary">IMMUTABLE, scan on push</text>
  <text x="732" y="128" text-anchor="middle" class="tiny textSecondary">AES256 encryption</text>

  <rect x="845" y="56" width="165" height="110" rx="8" class="infraBox"/>
  <text x="927" y="78" text-anchor="middle" class="lbl textPrimary">Terraform State</text>
  <text x="927" y="96" text-anchor="middle" class="sub textSecondary">S3 bucket</text>
  <text x="927" y="112" text-anchor="middle" class="sub textSecondary">+ DynamoDB lock table</text>

  <rect x="1040" y="56" width="150" height="50" rx="7" class="infraBox"/>
  <text x="1115" y="76" text-anchor="middle" class="lbl textPrimary">Route 53</text>
  <text x="1115" y="91" text-anchor="middle" class="tiny textSecondary">tm.sentineltrading.org</text>

  <rect x="1040" y="116" width="150" height="50" rx="7" class="infraBox"/>
  <text x="1115" y="136" text-anchor="middle" class="lbl textPrimary">ACM Certificate</text>
  <text x="1115" y="151" text-anchor="middle" class="tiny textSecondary">DNS-validated, TLS1.2_2021</text>

  <rect x="1220" y="66" width="140" height="60" rx="8" class="infraBox"/>
  <text x="1290" y="90" text-anchor="middle" class="lbl textPrimary">Client</text>
  <text x="1290" y="106" text-anchor="middle" class="sub textSecondary">browser</text>

  <!-- deploy arrows -->
  <line x1="215" y1="101" x2="243" y2="80" class="edgeDeploy" stroke-width="2" marker-end="url(#arrDeployM1)"/>
  <line x1="215" y1="101" x2="243" y2="141" class="edgeDeploy" stroke-width="2" marker-end="url(#arrDeployM1)"/>
  <line x1="435" y1="80" x2="463" y2="80" class="edgeDeploy" stroke-width="2" marker-end="url(#arrDeployM1)"/>
  <line x1="435" y1="141" x2="463" y2="141" class="edgeDeploy" stroke-width="2" marker-end="url(#arrDeployM1)"/>
  <line x1="620" y1="80" x2="648" y2="90" class="edgeDeploy" stroke-width="2" marker-end="url(#arrDeployM1)"/>
  <line x1="815" y1="100" x2="843" y2="100" class="edgeDeploy" stroke-width="2" marker-end="url(#arrDeployM1)"/>

  <!-- Client -> Route53 -->
  <path d="M1250,126 L1250,150 L1190,150" fill="none" class="edgeLive" stroke-width="2.2" marker-end="url(#arrLiveM1)"/>
  <text x="1195" y="145" class="tiny edgeText">HTTPS</text>

  <!-- ===================== AWS CLOUD ===================== -->
  <rect x="30" y="196" width="1340" height="790" rx="10" class="cloudBox"/>
  <text x="48" y="218" class="h2 laneLabel">AWS Cloud</text>

  <rect x="48" y="230" width="1304" height="740" rx="8" class="regionBox"/>
  <text x="66" y="252" class="h2 laneLabel">Region: eu-north-1</text>

  <rect x="66" y="264" width="1270" height="686" rx="8" class="vpcBox"/>
  <text x="84" y="286" class="h2 laneLabel">VPC rtrp-vpc — 10.0.0.0/16</text>

  <rect x="84" y="298" width="280" height="34" rx="6" class="infraBox"/>
  <text x="224" y="319" text-anchor="middle" class="tiny textPrimary">Public RT — 0.0.0.0/0 → igw</text>

  <rect x="380" y="298" width="280" height="34" rx="6" class="infraBox"/>
  <text x="520" y="319" text-anchor="middle" class="tiny textPrimary">Private RT — 0.0.0.0/0 → nat (single AZ)</text>

  <text x="1300" y="286" text-anchor="end" class="tiny textSecondary">Internet Gateway</text>

  <rect x="84" y="350" width="1234" height="580" rx="6" class="azBox" stroke-dasharray="6,4" fill="none"/>
  <text x="700" y="366" text-anchor="middle" class="tiny textSecondary">Availability Zone eu-north-1a (× eu-north-1b, symmetric)</text>

  <!-- Public subnet lane -->
  <rect x="100" y="382" width="1202" height="150" rx="6" class="publicLane"/>
  <text x="116" y="400" class="lbl laneLabel">Public Subnets — 10.0.1.0/24, 10.0.2.0/24</text>

  <rect x="130" y="416" width="220" height="80" rx="7" class="svcBox"/>
  <text x="240" y="440" text-anchor="middle" class="lbl textPrimary">Application Load Balancer</text>
  <text x="240" y="456" text-anchor="middle" class="tiny textSecondary">:80 → :443 redirect</text>
  <text x="240" y="470" text-anchor="middle" class="tiny textSecondary">TLS terminates here</text>
  <rect x="140" y="498" width="200" height="20" rx="10" class="pill"/>
  <text x="240" y="512" text-anchor="middle" class="tiny pillText">SG: 80, 443 from 0.0.0.0/0</text>

  <rect x="400" y="416" width="160" height="80" rx="7" class="svcBox"/>
  <text x="480" y="446" text-anchor="middle" class="lbl textPrimary">NAT Gateway</text>
  <text x="480" y="462" text-anchor="middle" class="tiny textSecondary">cost-optimized</text>
  <text x="480" y="476" text-anchor="middle" class="tiny textSecondary">single AZ</text>

  <!-- Target group -->
  <rect x="200" y="552" width="150" height="46" rx="6" class="infraBox"/>
  <text x="275" y="570" text-anchor="middle" class="tiny textPrimary">Target Group</text>
  <text x="275" y="584" text-anchor="middle" class="tiny textSecondary">ip-based, health-check /health</text>

  <!-- Private subnet lane -->
  <rect x="100" y="622" width="1202" height="270" rx="6" class="privateLane"/>
  <text x="116" y="640" class="lbl laneLabel">Private Subnets — 10.0.11.0/24, 10.0.12.0/24</text>

  <rect x="150" y="670" width="230" height="130" rx="7" class="svcBox"/>
  <text x="265" y="696" text-anchor="middle" class="lbl textPrimary">ECS Fargate Task</text>
  <text x="265" y="712" text-anchor="middle" class="tiny textSecondary">trade-api · :8000</text>
  <text x="265" y="726" text-anchor="middle" class="tiny textSecondary">no public IP</text>
  <text x="265" y="740" text-anchor="middle" class="tiny textSecondary">awsvpc networking</text>
  <rect x="165" y="758" width="200" height="20" rx="10" class="pill"/>
  <text x="265" y="772" text-anchor="middle" class="tiny pillText">SG: 8000 from ALB SG only</text>

  <rect x="440" y="670" width="200" height="80" rx="7" class="svcBox"/>
  <text x="540" y="696" text-anchor="middle" class="lbl textPrimary">CloudWatch Logs</text>
  <text x="540" y="712" text-anchor="middle" class="tiny textSecondary">/ecs/rtrp-trade-api</text>
  <text x="540" y="726" text-anchor="middle" class="tiny textSecondary">7-day retention</text>

  <!-- edges: ALB -> TG -> ECS -->
  <line x1="240" y1="496" x2="270" y2="550" class="edgeLive" stroke-width="2" marker-end="url(#arrLiveM1)"/>
  <text x="200" y="530" class="tiny edgeText">forward :8000</text>
  <line x1="275" y1="598" x2="265" y2="668" class="edgeLive" stroke-width="2" marker-end="url(#arrLiveM1)"/>

  <!-- Route53 -> ALB (alias record), ACM -> ALB — drawn here, after every box rect, so nothing paints over them -->
  <path d="M1040,80 L1000,80 L1000,400 L352,400 L352,416" fill="none" class="edgeLive" stroke-width="1.8" marker-end="url(#arrLiveM1)"/>
  <text x="1005" y="393" class="tiny edgeText">alias record</text>
  <path d="M1040,141 L975,141 L975,410 L344,410 L344,416" fill="none" class="edgeDeploy" stroke-width="1.4" stroke-dasharray="4,3" opacity="0.85" marker-end="url(#arrDeployM1)"/>
  <text x="900" y="424" class="tiny edgeText">TLS cert</text>

  <!-- egress only -->
  <path d="M150,730 L110,730 L110,460 L128,460" fill="none" class="edgeDeploy" stroke-width="1.4" stroke-dasharray="4,3" opacity="0.7" marker-end="url(#arrDeployM1)"/>
  <text x="60" y="600" class="tiny edgeText" transform="rotate(-90 60 600)">egress only, via NAT</text>

  <!-- logs -->
  <line x1="380" y1="720" x2="438" y2="712" class="edgeDeploy" stroke-width="1.4" stroke-dasharray="4,3" marker-end="url(#arrDeployM1)"/>
  <text x="385" y="708" class="tiny edgeText">awslogs driver</text>

  <!-- ECR image pull, routed around the ALB rather than through it -->
  <path d="M732,166 L732,240 L80,240 L80,735 L148,735" fill="none" class="edgeDeploy" stroke-width="1.6" stroke-dasharray="5,3" marker-end="url(#arrDeployM1)"/>
  <text x="500" y="234" class="tiny edgeText">image pull</text>

  <!-- Terraform apply -->
  <path d="M927,166 L927,264" fill="none" class="edgeDeploy" stroke-width="1.6" stroke-dasharray="5,3" marker-end="url(#arrDeployM1)"/>
  <text x="935" y="200" class="tiny edgeText">terraform apply</text>

  <text x="700" y="998" text-anchor="middle" class="tiny textSecondary">verified against github.com/Abdirahmanjabdi/RTRP — 17 Aug 2026</text>
</svg>
