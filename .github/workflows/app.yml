name: Build and Deploy App

on:
  push:
    branches:
      - main
    paths:
      - 'app/**'
      - 'Dockerfile'
      - '.github/workflows/app.yml'

permissions:
  id-token: write # Required for requesting the JWT OIDC token
  contents: read     # Required for checking out code

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::026703081738:role/rtrp-github-ci-role
          aws-region: eu-north-1

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, Tag, and Push Image to Amazon ECR
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: rtrp-trade-api
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG -t $ECR_REGISTRY/$ECR_REPOSITORY:latest .
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:latest

      - name: Update Amazon ECS Service
        run: |
          aws ecs update-service \
            --cluster rtrp-cluster \
            --service rtrp-trade-api-service \
            --force-new-deployment

      - name: Health Check Gate
        run: |
          echo "Waiting for service to stabilize and serve traffic..."
          sleep 30
          
          echo "Testing health endpoint..."
          response=$(curl -s -o /dev/null -w "%{http_code}" https://tm.sentineltrading.org/health)
          
          if [ "$response" -eq 200 ]; then
            echo "Health check passed with status 200 OK!"
          else
            echo "Health check failed with status code: $response"
            exit 1
          fi