{{- if .Values.tradeApi.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: trade-api
  annotations:
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - {{ .Values.tradeApi.ingress.host }}
      secretName: trade-api-tls
  rules:
    - host: {{ .Values.tradeApi.ingress.host }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: trade-api
                port:
                  number: 80
{{- end }}