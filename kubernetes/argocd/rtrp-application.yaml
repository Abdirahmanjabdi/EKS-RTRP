apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: rtrp-app
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/Abdirahmanjabdi/EKS-RTRP.git
    targetRevision: main
    path: helm/rtrp-app
  destination:
    server: https://kubernetes.default.svc
    namespace: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true